name: Build Android Release

on:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Web Dist
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://daysync-1.onrender.com/api' }}

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode Android Release Keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/daysync-release.keystore
          fi

      - name: Generate key.properties
        run: |
          if [ -n "${{ secrets.ANDROID_STORE_PASSWORD }}" ]; then
            cat <<EOF > android/key.properties
            storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
            keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
            keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
            storeFile=../app/daysync-release.keystore
            EOF
          fi

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Signed Android Release APK & AAB
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Daysync-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Signed AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Daysync-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
